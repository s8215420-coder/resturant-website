<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Cafe Crave</title>
  <meta name="description" content="Browse the Cafe Crave menu: coffee, breakfast, mains, desserts and drinks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600&family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container"><h1>Our Menu</h1><p>Search, filter and add your favourites to the cart.</p></div>
    </section>
    <section class="section">
      <div class="container">
        <div class="toolbar">
          <div class="filters" id="menu-filters" role="group" aria-label="Filter by category"></div>
          <input type="search" class="search" id="menu-search" placeholder="Search dishes…" aria-label="Search dishes">
        </div>
        <div class="grid grid-3" id="menu-grid" aria-live="polite"></div>
        <p class="no-results" id="no-results" hidden>No dishes match your search. Try a different keyword or category.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/main.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
