<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Cafe Crave</title>
  <meta name="description" content="Review the items in your Cafe Crave cart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600&family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container"><h1>Your Cart</h1><p>Review your items before checking out.</p></div>
    </section>

    <section class="section">
      <div class="container">
        <div class="empty-cart" id="cart-empty" hidden>
          <div class="icon" aria-hidden="true">🛒</div>
          <h2>Your cart is empty</h2>
          <p style="color:var(--muted);margin:.6rem 0 1.5rem">Looks like you haven't added anything yet.</p>
          <a href="menu.html" class="btn btn-primary">Browse Menu</a>
        </div>

        <div class="cart-layout">
          <ul id="cart-items" aria-live="polite"></ul>

          <aside class="summary" id="cart-summary" hidden aria-label="Order summary">
            <h3>Order Summary</h3>
            <div class="row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
            <div class="row"><span>GST (5%)</span><span id="gst">₹0</span></div>
            <div class="row total"><span>Total</span><span id="total">₹0</span></div>
            <button type="button" class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:1.2rem">Checkout (Demo)</button>
            <button type="button" class="btn btn-outline btn-block" id="clear-cart" style="margin-top:.7rem">Clear Cart</button>
            <p class="demo-note">This is a demo. No real order is placed and no payment is taken.</p>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="checkout-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <h3 id="modal-title">Review Your Order</h3>
      <div id="order-summary" style="margin-top:1rem"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="confirm-demo">Confirm Demo Order</button>
        <button type="button" class="btn btn-dark" id="close-modal">Close</button>
      </div>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
